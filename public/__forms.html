<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Form definitions</title></head>
  <body>
    <form name="plumbing-enquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="plumbing-enquiry">
      <input name="bot-field">
      <input name="name" type="text">
      <input name="phone" type="tel">
      <input name="email" type="email">
      <input name="suburb" type="text">
      <select name="service"><option>Blocked drains</option></select>
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
